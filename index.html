<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DinoChess 3D - Ajedrez en la Jungla</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #051405;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        /* UI Overlay */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #e2f7d5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #61d054;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        p.subtitle {
            font-size: 0.95rem;
            opacity: 0.85;
        }
        #turn-indicator {
            margin-top: 15px;
            display: inline-block;
            padding: 8px 16px;
            background: rgba(10, 30, 10, 0.75);
            border: 1px solid rgba(97, 208, 84, 0.4);
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            backdrop-filter: blur(4px);
        }
        #controls-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 20, 5, 0.8);
            border: 1px solid #326b27;
            color: #a3e092;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.5;
            backdrop-filter: blur(4px);
        }
    </style>
    <!-- Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui">
        <h1>DinoChess 3D</h1>
        <p class="subtitle">Ajedrez en la Selva Prehistórica</p>
        <div id="turn-indicator">Turno: <span id="turn-text" style="color: #ffd700;">Carnívoros (Blancas)</span></div>
    </div>

    <div id="controls-info">
        <strong>🎮 Controles:</strong><br>
        • Click Izquierdo + Arrastrar: Rotar cámara<br>
        • Click Derecho + Arrastrar: Mover cámara<br>
        • Rueda del Ratón: Zoom<br>
        • Click en Pieza: Seleccionar y Ver Movimientos Validables
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- CONFIGURACIÓN E INICIALIZACIÓN ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x061105);
        scene.fog = new THREE.FogExp2(0x0a1f0a, 0.025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Impedir ir bajo el suelo
        controls.minDistance = 5;
        controls.maxDistance = 25;
        controls.target.set(0, 0, 0);

        // --- ILUMINACIÓN AMBIENTAL DE JUNGLA ---
        const ambientLight = new THREE.AmbientLight(0x2d4a1d, 1.2);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5cc, 1.5);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        const d = 10;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // Luz de relleno verde jungla
        const jungleFill = new THREE.PointLight(0x11ff44, 0.5, 30);
        jungleFill.position.set(-10, 5, -10);
        scene.add(jungleFill);

        // --- MATERIALES ---
        const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x22150b, roughness: 0.8 });
        const whiteTileMat = new THREE.MeshStandardMaterial({ color: 0x8faf7d, roughness: 0.5 }); // Piedra verdosa clara
        const blackTileMat = new THREE.MeshStandardMaterial({ color: 0x1f361a, roughness: 0.6 }); // Piedra selva oscura
        
        // Materiales de los bandos
        const whiteTeamMat = new THREE.MeshStandardMaterial({ color: 0xd9c5a0, roughness: 0.3, metalness: 0.1 }); // Fósil Hueso / Carnívoros
        const blackTeamMat = new THREE.MeshStandardMaterial({ color: 0x2e3b2b, roughness: 0.4, metalness: 0.2 }); // Obsidiana / Herbívoros

        const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true });

        // --- ESCENARIO Y ENTORNO ---
        function createJungleEnvironment() {
            // Suelo de barro/musgo
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x0c1a09, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);

            // Árboles y vegetación circundante
            const treeTrunkGeo = new THREE.CylinderGeometry(0.2, 0.4, 4, 6);
            const treeFoliageGeo = new THREE.DodecahedronGeometry(1.5);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.9 });
            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x184d15, roughness: 0.7 });

            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 7 + Math.random() * 18;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;

                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(treeTrunkGeo, trunkMat);
                trunk.position.y = 2;
                trunk.castShadow = true;
                tree.add(trunk);

                const foliage = new THREE.Mesh(treeFoliageGeo, foliageMat);
                foliage.position.y = 4.2;
                foliage.scale.set(1 + Math.random()*0.5, 1 + Math.random()*0.8, 1 + Math.random()*0.5);
                foliage.castShadow = true;
                tree.add(foliage);

                tree.position.set(x, -0.5, z);
                scene.add(tree);
            }
        }
        createJungleEnvironment();

        // --- TABLERO DE AJEDREZ ---
        const boardGroup = new THREE.Group();
        const tileSize = 1;
        const boardOffset = 3.5;
        const tiles = [];

        // Base del tablero (Piedra antigua)
        const baseGeo = new THREE.BoxGeometry(9, 0.6, 9);
        const baseMesh = new THREE.Mesh(baseGeo, darkWoodMat);
        baseMesh.position.y = -0.3;
        baseMesh.receiveShadow = true;
        boardGroup.add(baseMesh);

        for (let row = 0; row < 8; row++) {
            tiles[row] = [];
            for (let col = 0; col < 8; col++) {
                const isWhite = (row + col) % 2 === 0;
                const tileGeo = new THREE.BoxGeometry(tileSize, 0.2, tileSize);
                const tile = new THREE.Mesh(tileGeo, isWhite ? whiteTileMat : blackTileMat);
                
                const x = col * tileSize - boardOffset;
                const z = row * tileSize - boardOffset;
                
                tile.position.set(x, 0, z);
                tile.receiveShadow = true;
                tile.userData = { row, col, isTile: true };
                
                boardGroup.add(tile);
                tiles[row][col] = tile;
            }
        }
        scene.add(boardGroup);

        // --- CONSTRUCTOR DE ESCULTURAS / PIEZAS DE DINOSAURIO ---
        function createDinoGeometry(type) {
            const group = new THREE.Group();

            if (type === 'P') { 
                // Peón: Cráneo/Huevo Raptor
                const bodyGeo = new THREE.SphereGeometry(0.28, 8, 8);
                bodyGeo.scale(0.8, 1.2, 1);
                const body = new THREE.Mesh(bodyGeo);
                body.position.y = 0.35;
                group.add(body);
            } else if (type === 'R') { 
                // Torre: Estegosaurio con placas
                const bodyGeo = new THREE.BoxGeometry(0.5, 0.4, 0.7);
                const body = new THREE.Mesh(bodyGeo);
                body.position.y = 0.3;
                group.add(body);

                for (let i = -0.2; i <= 0.2; i += 0.2) {
                    const plateGeo = new THREE.ConeGeometry(0.12, 0.25, 3);
                    const plate = new THREE.Mesh(plateGeo);
                    plate.position.set(0, 0.6, i);
                    plate.rotation.x = Math.PI / 6;
                    group.add(plate);
                }
            } else if (type === 'N') { 
                // Caballo: Velociraptor Erguido
                const bodyGeo = new THREE.CylinderGeometry(0.12, 0.2, 0.5);
                const body = new THREE.Mesh(bodyGeo);
                body.position.set(0, 0.3, -0.1);
                body.rotation.x = Math.PI / 6;
                group.add(body);

                const headGeo = new THREE.BoxGeometry(0.18, 0.18, 0.4);
                const head = new THREE.Mesh(headGeo);
                head.position.set(0, 0.6, 0.1);
                group.add(head);
            } else if (type === 'B') { 
                // Alfil: Triceratops
                const headGeo = new THREE.ConeGeometry(0.35, 0.25, 5);
                const head = new THREE.Mesh(headGeo);
                head.position.set(0, 0.45, 0);
                head.rotation.x = -Math.PI / 3;
                group.add(head);

                // Cuernos
                [-0.12, 0.12].forEach(x => {
                    const hornGeo = new THREE.ConeGeometry(0.04, 0.3, 4);
                    const horn = new THREE.Mesh(hornGeo);
                    horn.position.set(x, 0.6, 0.1);
                    horn.rotation.x = Math.PI / 4;
                    group.add(horn);
                });
            } else if (type === 'Q') { 
                // Reina: Pterodáctilo con alas extendidas
                const bodyGeo = new THREE.ConeGeometry(0.2, 0.7, 5);
                const body = new THREE.Mesh(bodyGeo);
                body.position.y = 0.5;
                group.add(body);

                const wingGeo = new THREE.BoxGeometry(0.8, 0.04, 0.25);
                const wing = new THREE.Mesh(wingGeo);
                wing.position.set(0, 0.65, 0);
                group.add(wing);
            } else if (type === 'K') { 
                // Rey: Tyrannosaurus Rex
                const bodyGeo = new THREE.CylinderGeometry(0.22, 0.3, 0.6);
                const body = new THREE.Mesh(bodyGeo);
                body.position.y = 0.4;
                group.add(body);

                const jawGeo = new THREE.BoxGeometry(0.28, 0.22, 0.45);
                const jaw = new THREE.Mesh(jawGeo);
                jaw.position.set(0, 0.75, 0.1);
                group.add(jaw);
            }

            // Pedestal unificado para la pieza
            const baseGeo = new THREE.CylinderGeometry(0.38, 0.4, 0.12, 12);
            const base = new THREE.Mesh(baseGeo);
            base.position.y = 0.06;
            group.add(base);

            return group;
        }

        // --- ESTADO Y LÓGICA DEL JUEGO ---
        const boardState = Array(8).fill(null).map(() => Array(8).fill(null));
        let currentTurn = 'white'; // 'white' o 'black'
        let selectedPiece = null;
        let highlightBox = null;

        const initialLayout = [
            ['R','N','B','Q','K','B','N','R'],
            ['P','P','P','P','P','P','P','P'],
            [],[],[],[],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        function spawnPieces() {
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const type = initialLayout[row][col];
                    if (!type) continue;

                    const color = (row < 2) ? 'black' : 'white';
                    const pieceMesh = createDinoGeometry(type);
                    
                    // Asignar materiales a todos los hijos
                    const mat = (color === 'white') ? whiteTeamMat : blackTeamMat;
                    pieceMesh.traverse(child => {
                        if (child.isMesh) {
                            child.material = mat;
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    // Orientación (mirar al centro)
                    if (color === 'black') pieceMesh.rotation.y = Math.PI;

                    const x = col * tileSize - boardOffset;
                    const z = row * tileSize - boardOffset;
                    pieceMesh.position.set(x, 0.1, z);

                    pieceMesh.userData = { row, col, type, color, isPiece: true };
                    scene.add(pieceMesh);
                    boardState[row][col] = pieceMesh;
                }
            }
        }
        spawnPieces();

        // --- INTERACCIÓN Y SELECCIÓN ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', onPointerDown);

        function onPointerDown(event) {
            // Calcular posición del mouse normalizada
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                
                // Subir hasta encontrar el grupo con userData
                while (obj.parent && !obj.userData.isPiece && !obj.userData.isTile && obj.parent !== scene) {
                    obj = obj.parent;
                }

                if (obj.userData.isPiece) {
                    handlePieceClick(obj);
                } else if (obj.userData.isTile) {
                    handleTileClick(obj);
                }
            }
        }

        function handlePieceClick(piece) {
            if (piece.userData.color !== currentTurn) {
                // Intento de captura si hay una pieza seleccionada
                if (selectedPiece) {
                    movePiece(selectedPiece, piece.userData.row, piece.userData.col);
                }
                return;
            }

            selectedPiece = piece;
            highlightSquare(piece.userData.row, piece.userData.col);
        }

        function handleTileClick(tile) {
            if (selectedPiece) {
                movePiece(selectedPiece, tile.userData.row, tile.userData.col);
            }
        }

        function highlightSquare(row, col) {
            if (!highlightBox) {
                const geo = new THREE.BoxGeometry(1.02, 0.22, 1.02);
                highlightBox = new THREE.Mesh(geo, highlightMat);
                scene.add(highlightBox);
            }
            const x = col * tileSize - boardOffset;
            const z = row * tileSize - boardOffset;
            highlightBox.position.set(x, 0.01, z);
            highlightBox.visible = true;
        }

        function movePiece(piece, targetRow, targetCol) {
            const startRow = piece.userData.row;
            const startCol = piece.userData.col;

            // Evitar mover al mismo sitio
            if (startRow === targetRow && startCol === targetCol) return;

            // Lógica de Captura
            const targetPiece = boardState[targetRow][targetCol];
            if (targetPiece) {
                if (targetPiece.userData.color === piece.userData.color) {
                    // Seleccionar la nueva pieza propia
                    handlePieceClick(targetPiece);
                    return;
                }
                // Remover pieza enemiga
                scene.remove(targetPiece);
            }

            // Actualizar Matriz
            boardState[startRow][startCol] = null;
            boardState[targetRow][targetCol] = piece;

            // Actualizar Posición 3D y Propiedades
            piece.userData.row = targetRow;
            piece.userData.col = targetCol;

            const targetX = targetCol * tileSize - boardOffset;
            const targetZ = targetRow * tileSize - boardOffset;

            // Animación simple de movimiento
            piece.position.set(targetX, 0.1, targetZ);

            // Deseleccionar y cambiar turno
            selectedPiece = null;
            if (highlightBox) highlightBox.visible = false;

            switchTurn();
        }

        function switchTurn() {
            currentTurn = (currentTurn === 'white') ? 'black' : 'white';
            const turnText = document.getElementById('turn-text');
            if (currentTurn === 'white') {
                turnText.innerText = "Carnívoros (Blancas)";
                turnText.style.color = "#ffd700";
            } else {
                turnText.innerText = "Herbívoros (Negras)";
                turnText.style.color = "#61d054";
            }
        }

        // --- ADAPTACIÓN A CAMBIOS DE VENTANA ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- BUCLE DE ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Sutil flotación ambiental de la luz/vegetación
            const time = Date.now() * 0.001;
            jungleFill.intensity = 0.4 + Math.sin(time * 2) * 0.1;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
